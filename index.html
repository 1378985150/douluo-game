<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>斗罗大陆 · 文字冒险</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#1a1a2e;color:#e0d5c1;font-family:Georgia,serif;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:16px;}
        .container{max-width:820px;width:100%;background:#2a1f0e;border:2px solid #b8860b;border-radius:20px;padding:24px;box-shadow:0 0 60px rgba(184,134,11,0.25);}
        .header{text-align:center;border-bottom:2px solid #b8860b;padding-bottom:12px;margin-bottom:20px;}
        .header h1{font-size:28px;color:#f0d080;letter-spacing:6px;text-shadow:0 0 20px #b8860b55;}
        .header .sub{color:#9a8b7a;font-size:14px;letter-spacing:2px;}
        .chat-box{background:#0d0a06dd;border:1px solid #7a5f2e;border-radius:14px;padding:16px;height:400px;overflow-y:auto;margin-bottom:16px;font-size:15px;line-height:1.7;color:#eadbc5;}
        .chat-box .user-msg{text-align:right;color:#b6d0ff;margin:8px 0;}
        .chat-box .bot-msg{text-align:left;color:#eadbc5;margin:8px 0;white-space:pre-wrap;}
        .chat-box .system-msg{text-align:center;color:#b8860b;font-style:italic;font-size:13px;margin:10px 0;}
        .input-area{display:flex;gap:10px;flex-wrap:wrap;}
        .input-area input{flex:1;min-width:180px;padding:14px 18px;border-radius:30px;border:1px solid #7a5f2e;background:#1e160c;color:#f0e0c8;font-size:15px;outline:none;}
        .input-area input:focus{border-color:#d4a017;box-shadow:0 0 18px #d4a01733;}
        .input-area button{padding:14px 30px;border-radius:30px;border:none;background:#b8860b;color:#1a1208;font-weight:bold;font-size:15px;cursor:pointer;}
        .input-area button:hover{background:#d4a017;box-shadow:0 0 24px #d4a01766;}
        .quick-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;justify-content:center;}
        .quick-actions button{background:#2d1f0e;border:1px solid #7a5f2e;color:#c4b094;padding:8px 16px;border-radius:20px;font-size:13px;cursor:pointer;}
        .quick-actions button:hover{background:#4d351a;border-color:#b8860b;color:#f0d080;}
        .status-bar{margin-top:16px;display:flex;justify-content:space-between;font-size:13px;color:#8a7b68;border-top:1px solid #3d2b14;padding-top:12px;}
        .status-bar .api-status{color:#6aa84f;}
        ::-webkit-scrollbar{width:6px;}
        ::-webkit-scrollbar-track{background:#1a1208;}
        ::-webkit-scrollbar-thumb{background:#7a5f2e;border-radius:10px;}
    </style>
</head>
<body>
<div class="container">
    <div class="header"><h1>✦ 斗 罗 大 陆 ✦</h1><div class="sub">命运觉醒 · 成神之路</div></div>
    <div class="chat-box" id="chatBox"><div class="system-msg">✦ 欢迎来到斗罗大陆 ✦</div><div class="bot-msg">请输入「开始游戏」开启你的命运。</div></div>
    <div class="input-area"><input type="text" id="userInput" placeholder="输入你的行动..." /><button id="sendBtn">发送</button></div>
    <div class="quick-actions">
        <button data-msg="开始游戏">开始游戏</button>
        <button data-msg="/状态">/状态</button>
        <button data-msg="/档案">/档案</button>
        <button data-msg="查看唐三">查看唐三</button>
        <button data-msg="前往星斗大森林">前往星斗大森林</button>
    </div>
    <div class="status-bar"><span>⚔️ 冒险进行中</span><span class="api-status" id="apiStatus">● 后端已连接</span></div>
</div>
<script>
const API_URL = window.location.origin + "/api/chat";
const chatBox=document.getElementById('chatBox'), userInput=document.getElementById('userInput'), sendBtn=document.getElementById('sendBtn'), apiStatus=document.getElementById('apiStatus');
function addMessage(text,type='bot'){const d=document.createElement('div');d.className=type==='user'?'user-msg':'bot-msg';d.textContent=text;chatBox.appendChild(d);chatBox.scrollTop=chatBox.scrollHeight;}
function addSystem(text){const d=document.createElement('div');d.className='system-msg';d.textContent=text;chatBox.appendChild(d);chatBox.scrollTop=chatBox.scrollHeight;}
async function sendToAI(message){
    addSystem('⏳ AI 正在思考...');
    try{
        const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})});
        const loading=chatBox.querySelector('.system-msg:last-child');
        if(loading&&loading.textContent.includes('思考中'))loading.remove();
        if(!res.ok){addSystem('❌ 后端错误：'+res.status);return;}
        const data=await res.json();
        if(data.error){addSystem('❌ '+data.error);return;}
        if(data.reply)addMessage(data.reply,'bot');
    }catch(e){addSystem('❌ 网络错误：'+e.message);}
}
function sendMessage(){const text=userInput.value.trim();if(!text)return;addMessage(text,'user');userInput.value='';sendToAI(text);}
sendBtn.onclick=sendMessage;
userInput.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();sendMessage();}};
document.querySelectorAll('.quick-actions button').forEach(b=>{b.onclick=()=>{userInput.value=b.dataset.msg;sendMessage();};});
async function checkHealth(){try{const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'ping'})});if(res.ok){apiStatus.textContent='● 后端已连接';apiStatus.style.color='#6aa84f';}else{apiStatus.textContent='⚠️ 后端异常';apiStatus.style.color='#e67e22';}}catch{apiStatus.textContent='⚠️ 后端未响应';apiStatus.style.color='#e74c3c';}}
checkHealth();setInterval(checkHealth,30000);
</script>
</body>
</html>
